apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-resource-deletion-if-has-prevent-deletion-label
spec:
  steps:
  - name: install-cluster-crd
    try:
    - apply:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: clusters.cluster.x-k8s.io
          spec:
            group: cluster.x-k8s.io
            names:
              kind: Cluster
              listKind: ClusterList
              plural: clusters
              singular: cluster
            scope: Namespaced
            versions:
            - name: v1beta1
              served: true
              storage: true
              schema:
                openAPIV3Schema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              subresources:
                status: {}
            - name: v1beta2
              served: true
              storage: false
              schema:
                openAPIV3Schema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              subresources:
                status: {}

  - name: check-policy-ready
    use:
      template: ../_steps-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: block-resource-deletion-if-has-prevent-deletion-label

  - name: allow-delete-without-label
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-no-prevent-label
          data:
            key: value
    - delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: cm-no-prevent-label

  # The protected ConfigMap is created here and intentionally NOT cleaned up in this step.
  # It is deleted in the allow-delete-after-label-removal-2 step below so that when
  # chainsaw's auto-cleanup for this step runs (in reverse order), the resource is already gone.
  - name: create-protected-configmap
    try:
    - apply:
        file: cm-with-prevent-label.yaml

  - name: deny-delete-with-prevent-label
    try:
    - delete:
        expect:
        - check:
            ($error != null): true
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: cm-with-prevent-label

  - name: allow-delete-after-label-removal
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-label-removed
            labels:
              giantswarm.io/prevent-deletion: "true"
          data:
            key: value
    - script:
        content: |
          kubectl label configmap cm-label-removed "giantswarm.io/prevent-deletion-" -n "$NAMESPACE"
    - delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: cm-label-removed

  # Remove label from cm-with-prevent-label then assert deletion succeeds.
  # Doing this in a dedicated step ensures chainsaw's reverse-order auto-cleanup
  # finds the resource already gone when it reaches create-protected-configmap.
  - name: allow-delete-protected-configmap-after-label-removal
    try:
    - script:
        content: |
          kubectl label configmap cm-with-prevent-label "giantswarm.io/prevent-deletion-" -n "$NAMESPACE"
    - delete:
        expect:
        - check:
            ($error != null): false
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: cm-with-prevent-label

  # Helm deletes a `Cluster` through the API version of its rendered manifest. Cover each served version.
  - name: allow-delete-cluster-without-label-v1beta1
    try:
    - apply:
        resource:
          apiVersion: cluster.x-k8s.io/v1beta1
          kind: Cluster
          metadata:
            name: unprotected-v1beta1
          spec: {}
    - delete:
        ref:
          apiVersion: cluster.x-k8s.io/v1beta1
          kind: Cluster
          name: unprotected-v1beta1

  - name: allow-delete-cluster-without-label-v1beta2
    try:
    - apply:
        resource:
          apiVersion: cluster.x-k8s.io/v1beta2
          kind: Cluster
          metadata:
            name: unprotected-v1beta2
          spec: {}
    - delete:
        ref:
          apiVersion: cluster.x-k8s.io/v1beta2
          kind: Cluster
          name: unprotected-v1beta2

  # Like the protected ConfigMap, these are deleted in the last step, after removing the label
  - name: create-protected-clusters
    try:
    - apply:
        resource:
          apiVersion: cluster.x-k8s.io/v1beta1
          kind: Cluster
          metadata:
            name: protected-v1beta1
            labels:
              giantswarm.io/prevent-deletion: "true"
          spec: {}
    - apply:
        resource:
          apiVersion: cluster.x-k8s.io/v1beta2
          kind: Cluster
          metadata:
            name: protected-v1beta2
            labels:
              giantswarm.io/prevent-deletion: "true"
          spec: {}

  - name: deny-delete-cluster-with-prevent-label-v1beta1
    try:
    - delete:
        expect:
        - check:
            ($error != null): true
        ref:
          apiVersion: cluster.x-k8s.io/v1beta1
          kind: Cluster
          name: protected-v1beta1

  - name: deny-delete-cluster-with-prevent-label-v1beta2
    try:
    - delete:
        expect:
        - check:
            ($error != null): true
        ref:
          apiVersion: cluster.x-k8s.io/v1beta2
          kind: Cluster
          name: protected-v1beta2

  - name: allow-delete-protected-clusters-after-label-removal
    try:
    - script:
        content: |
          kubectl label clusters.cluster.x-k8s.io protected-v1beta1 protected-v1beta2 "giantswarm.io/prevent-deletion-" -n "$NAMESPACE"
    - delete:
        expect:
        - check:
            ($error != null): false
        ref:
          apiVersion: cluster.x-k8s.io/v1beta1
          kind: Cluster
          name: protected-v1beta1
    - delete:
        expect:
        - check:
            ($error != null): false
        ref:
          apiVersion: cluster.x-k8s.io/v1beta2
          kind: Cluster
          name: protected-v1beta2
